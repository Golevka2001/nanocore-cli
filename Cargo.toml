[package]
name = "nanocore"
version = "0.1.0"
edition = "2024"
description = "Reverse-engineered control library for the Nanocore (TPE-S10) MIDI guitar effects processor"
license = "GPL-3.0-only"
repository = "https://github.com/Golevka2001/nanocore-cli"

[features]
default = []
## Real MIDI I/O via `midir` (CoreMIDI on macOS, ALSA on Linux, WinMM on Windows).
## Also enables the `nanocore-cli` binary (which needs `clap`).
midi = ["dep:midir", "dep:clap", "dep:clap_complete"]

[dependencies]
midir = { version = "0.11", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true, features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "nanocore-cli"
path = "src/bin/nanocore-cli/main.rs"
required-features = ["midi"]
